<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAÇA PARTE DA EQUIPE</title>
    <link rel="stylesheet" href="../css/formulario.css">
    <link rel="icon" href="../images/GALAXIA-ICON.png">

</head>

<body>

    <div class="menu-btn" onclick="abrirMenu()">☰</div>

    <div class="sidebar" id="sidebar">
        <a href="../index.html">Home</a>
        <a href="../pages/lojinha.html">Loja 🛒</a>
        <a href="../pages/infoplanetas.html">Informações Planetas</a>
        <a href="../pages/landingPage.html">Landing Page</a>
        <a href="../pages/sobre.html">Sobre</a>
    </div>

    <div class="container">

        <h1>Faça Parte da Equipe 🚀</h1>
        <p>
            Preencha o formulário abaixo para participar da nossa equipe de programadores.
        </p>
<br>
<!-- formulario -->
        <form action="" method="get">

            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" required>

            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(31) 99999-9999" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required>

            <label for="gitHubLink">GitHub</label>
            <input type="text" id="gitHubLink" name="gitHubLink" required>

            <label for="idade">Idade</label>
            <input type="number" id="idade" name="idade" min="12" max="99" required>

            <label for="linguagem">Linguagem Favorita</label>
            <select id="linguagem" name="linguagem">
                <option>HTML</option>
                <option>CSS</option>
                <option>JavaScript</option>
                <option>Python</option>
                <option>Java</option>
                <option>PHP</option>
                <option>C#</option>
            </select>

            <label for="nivel">Nível de Programação</label>
            <select id="nivel" name="nivel">
                <option>Iniciante</option>
                <option>Intermediário</option>
                <option>Avançado</option>
            </select>
<br><br>


            <button type="submit">Enviar Formulário</button>

        </form>



    </div>

    <script>
        function abrirMenu() {
            document.getElementById("sidebar").classList.toggle("active");
        }
    </script>

</body>

</html>
